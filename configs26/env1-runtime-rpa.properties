#----------------------------------------------------------------------
# Logging
#----------------------------------------------------------------------

export CP4BA_LOGGING_ENABLED=true
export CP4BA_LOG_LEVEL="INFO"
export CP4BA_LOG_TO_CONSOLE=true
export CP4BA_LOG_TO_FILE=true
export CP4BA_LOG_FILE="${CP4BA_LOG_FILE:-${CP4BA_INST_OUTPUT_FOLDER}/installation-${CP4BA_INST_NAMESPACE}-"$(date "+%Y-%m-%d-%H_%M_%S")"-$USER-$RANDOM.log}"
export CP4BA_LOG_MAX_SIZE=$((10 * 1024 * 1024))
export CP4BA_LOG_BACKUP_COUNT=5

#----------------------------------------------------------------------
# Networkpolicy
#----------------------------------------------------------------------

export CP4BA_INST_NP_DEPLOY="false"

# Create all policies in folder
export CP4BA_INST_NP_SCAN_FOLDER="true"
export CP4BA_INST_NP_FOLDER="../templates-networkpolicies"

